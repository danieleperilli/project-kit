interface:
  display_name: "Project Kit"
  short_description: "Create architecture-first, developer-led Codex baselines"
  default_prompt: "Use $project-kit to bootstrap a new repository or align an existing one for an architecture-first, developer-led Codex workflow. Favor durable architecture context, explicit constraints, per-feature briefs, human-owned design references for UI work, and review-gated implementation over vibe-coding or heavyweight Agile rituals. Read project-config.json automatically during init when it exists, ask for any remaining missing required init metadata before scaffolding, treat features as optional during init, write the resolved init metadata to project-config.json in the target repository when it does not already exist, preserve the full free-form source request translated into English under originalPromptEnglish when the config is generated from chat, do not ask for a project version during init, translate non-English file-facing content into English, and initialize Git only when explicitly requested and safe."
  icon_large: "./assets/icon.svg"

policy:
  allow_implicit_invocation: true
